appId: dev.buddy.desktop
productName: Buddy
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - '!out/native/**'
  - package.json
  - '!**/*.md'
  - '!docs/**'
extraResources:
  - from: out/native/buddy-display
    to: native/buddy-display
  - from: integrations
    to: integrations
  - from: resources/buddy-brand.png
    to: buddy-brand.png
  - from: resources/buddyTrayTemplate.png
    to: buddyTrayTemplate.png
  - from: resources/buddyTrayTemplate@2x.png
    to: buddyTrayTemplate@2x.png
asar: true
mac:
  icon: resources/buddy-app.icns
  extendInfo:
    LSUIElement: true
  category: public.app-category.developer-tools
  minimumSystemVersion: '13.0.0'
  target:
    - dmg
    - zip
  hardenedRuntime: true
  binaries:
    - Contents/Resources/native/buddy-display
  artifactName: '${productName}-${version}-${arch}.${ext}'
dmg:
  title: Buddy
