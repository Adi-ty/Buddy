appId: dev.buddy.desktop
productName: Buddy
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - '!out/native/**'
  - package.json
  - '!**/*.md'
  - '!docs/**'
extraResources:
  - from: out/native/buddy-display
    to: native/buddy-display
  - from: integrations
    to: integrations
  - from: resources/trayTemplate.png
    to: trayTemplate.png
asar: true
mac:
  extendInfo:
    LSUIElement: true
  category: public.app-category.developer-tools
  minimumSystemVersion: '13.0.0'
  target:
    - dmg
    - zip
  hardenedRuntime: true
  binaries:
    - Contents/Resources/native/buddy-display
  artifactName: '${productName}-${version}-${arch}.${ext}'
dmg:
  title: Buddy
